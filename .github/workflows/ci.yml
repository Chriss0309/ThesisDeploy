name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: thesisdeploy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_URL: postgresql://ci:ci@localhost:5432/thesisdeploy
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
      # Integration tests (sign-in against the stub provider) truncate this database.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/thesisdeploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations apply and match the schema
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d thesisdeploy -c "create database shadow"
          npm run db:migrate
          npm run db:drift
      - run: npm test
      - run: npm run build
